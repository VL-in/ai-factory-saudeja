stages:
  # Gate de dados (Passo 10.3): barra o dataset ANTES de treinar -- schema,
  # regra de negocio do contrato de features e distribuicao. O `preprocess`
  # depende do selo (dados_validados.json), que e' o que garante a ordem entre
  # os dois stages; o selo so' carrega o que depende do dado, entao mudar uma
  # checagem aqui nao re-treina o modelo. O relatorio completo (inclusive PSI
  # producao x semente) e' lido pelo src/retrain_gate.py para o resumo do run.
  validate_data:
    cmd: >-
      docker compose run --rm --build -T
      -e DATA_PATH=/app/data/consultas-treino.csv
      -e CONSULTAS_HISTORICAS_PATH=/app/data/consultas-historicas.csv
      -e SELO_DADOS_PATH=/app/data/interim/dados_validados.json
      -e RELATORIO_DADOS_PATH=/app/data/interim/relatorio_dados.json
      train
      src/validate_data.py
    deps:
      - dockerfile
      - docker-compose.yml
      - requirements/base.txt
      - requirements/train.txt
      - src/validate_data.py
      - src/contrato_features.py
      - src/agenda_clinica.py
      - src/preprocess.py
      - src/features.py
      - src/config_projeto.py
      - data/consultas-treino.csv
      - data/consultas-historicas.csv
    params:
      - cadastro.especialidades
      - dados
      - gate.tolerancia
    outs:
      - data/interim/dados_validados.json
      - data/interim/relatorio_dados.json

  preprocess:
    cmd: >-
      docker compose run --rm --build -T
      -e DATA_PATH=/app/data/consultas-treino.csv
      -e TRAIN_RAW_PATH=/app/data/interim/train_raw.pkl
      -e TEST_PATH=/app/data/interim/test.pkl
      -e MAPA_ESPECIALIDADE_PATH=/app/data/interim/mapa_especialidade.json
      train
      src/preprocess.py
    deps:
      - dockerfile
      - docker-compose.yml
      - requirements/base.txt
      - requirements/train.txt
      - src/preprocess.py
      - src/features.py
      - src/contrato_features.py
      - src/agenda_clinica.py
      - src/config_projeto.py
      - data/consultas-treino.csv
      - data/interim/dados_validados.json
    params:
      - features.temporais
    outs:
      - data/interim/train_raw.pkl
      - data/interim/test.pkl
      - data/interim/mapa_especialidade.json

  train:
    cmd: >-
      docker compose up -d --wait mlflow-server &&
      docker compose run --rm --build -T
      -e TRAIN_RAW_PATH=/app/data/interim/train_raw.pkl
      -e MAPA_ESPECIALIDADE_PATH=/app/data/interim/mapa_especialidade.json
      -e MODEL_PATH=/app/data/model.pkl
      -e RUN_ID_PATH=/app/data/interim/mlflow_run_id.txt
      -e MLFLOW_TRACKING_URI=http://mlflow-server:5000
      train
      src/train.py
    deps:
      - dockerfile
      - docker-compose.yml
      - requirements/base.txt
      - requirements/train.txt
      - src/train.py
      - src/preprocess.py
      - src/config_projeto.py
      - data/interim/train_raw.pkl
      - data/interim/mapa_especialidade.json
    params:
      - model.n_estimators
      - model.learning_rate
      - model.max_depth
      - model.num_leaves
      - balancing.k_neighbors
    outs:
      - data/model.pkl
      - data/interim/mlflow_run_id.txt

  validate:
    cmd: >-
      docker compose up -d --wait mlflow-server &&
      docker compose run --rm --build -T
      -e TEST_PATH=/app/data/interim/test.pkl
      -e MODEL_PATH=/app/data/model.pkl
      -e RUN_ID_PATH=/app/data/interim/mlflow_run_id.txt
      -e MLFLOW_TRACKING_URI=http://mlflow-server:5000
      train
      src/validate.py
    deps:
      - dockerfile
      - docker-compose.yml
      - requirements/base.txt
      - requirements/train.txt
      - src/validate.py
      - src/config_projeto.py
      - data/model.pkl
      - data/interim/test.pkl
      - data/interim/mlflow_run_id.txt
    params:
      - decision.threshold
