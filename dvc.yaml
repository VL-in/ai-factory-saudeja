stages:
  train:
    cmd: >-
      docker build -t saudeja-train -f dockerfile . &&
      docker run --rm
      -v "%cd%/data:/app/data"
      -e MODEL_PATH=/app/data/model.pkl
      -e MLFLOW_TRACKING_URI=sqlite:////app/data/mlflow.db
      saudeja-train
    deps:
      - dockerfile
      - requirements.txt
      - src/train.py
      - data/consultas-historicas.csv
    outs:
      - data/model.pkl
      - data/mlflow.db
