# Type-check estatico. Mesmo comando
# local e no CI, sem flags extras (docs/architecture.md §8):
#
#     mypy src scripts
#
# Arquivo dedicado em vez de pyproject.toml pelo mesmo motivo do ruff.toml:
# este repo nao e' um pacote Python instalavel, e um pyproject.toml na raiz
# confundiria pip/build tools.
#
# O que o mypy guarda aqui e o que ele NAO guarda: a fronteira ESCALAR entre
# banco/configuracao e modelo (date vs str vinda do JSON do Supabase, retorno
# None de repositorio, chave trocada). A fronteira TABULAR (colunas, dtypes,
# dominio de um DataFrame) e' do contrato de features (src/contrato_features.py),
# em runtime. E fuso horario nao e' tipo: datetime naive e com fuso
# sao o mesmo `datetime` para o mypy -- quem protege contra deslocamento de
# fuso e' o teste de regressao (tests/test_skew_features.py).
[mypy]
python_version = 3.10

# Obrigatorios, nao estilo: nao existe __init__.py em src/, e db/, api/, ui/,
# jobs/ e messaging/ sao pacotes implicitos (PEP 420). Sem estas tres opcoes o
# mypy deriva o nome do modulo do caminho do arquivo e src/db/client.py e
# src/messaging/client.py colidem no mesmo modulo `client` -- o gate morreria
# num erro de duplicata antes de verificar tipo algum (medido em 2026-09-30).
mypy_path = src
explicit_package_bases = true
namespace_packages = true

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false

# --- Nivel 1: fronteira escalar (datas, identificadores, telefone, threshold,
# retorno de repositorio). E' onde o tipo carrega invariante de negocio e onde
# o erro chega ao paciente. Toda funcao aqui declara tipos.
[mypy-contrato_features,config_projeto,agenda_clinica,db.client,db.repositories,export_treino,jobs.inferencia_diaria,messaging.client,observabilidade,api.schemas,retrain_gate,sanidade_modelo,validate_data,campeao,canario]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

# --- Nivel "baseline" (todo o resto de src/ e scripts/): o mypy so' verifica
# o que ja' esta' anotado. Assinaturas DataFrame -> DataFrame, onde ele nao
# agrega e a garantia vem do contrato do 10.3. Intencional, nao esquecimento.

# --- Dependencias sem stubs. POR MODULO, nunca `ignore_missing_imports`
# global: assim uma dependencia nova sem stub aparece como erro em vez de
# passar calada. pandas fica aqui de proposito: o pandas-stubs e' pacote
# separado e ruidoso, e `df: pd.DataFrame` nao diz nada sobre colunas/dtypes
# -- que e' o que o contrato do 10.3 garante.
[mypy-pandas.*,sklearn.*,shap.*,joblib.*,imblearn.*]
ignore_missing_imports = true
