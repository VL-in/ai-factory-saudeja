# Purga LGPD: pedidos do titular e retencao (ADR-009, ADR-010).
#
# O unico workflow que APAGA do remote do DVC. Por isso fica isolado:
#   - environment `lgpd`, restrito ao branch `main` na configuracao do
#     environment (Settings -> Environments -> lgpd -> Deployment branches):
#     codigo de PR nunca chega a' credencial de exclusao;
#   - SAS propria, AZURE_STORAGE_CONNECTION_STRING_EXCLUSAO, com read, list e
#     delete (rld), SEM write, assinada com uma chave diferente das outras e
#     com validade curta: se vazar, nao substitui arquivo nenhum;
#   - disparo agendado ou manual SEM input: o repositorio e' publico, e um
#     identificador de titular num input apareceria na pagina do run. O
#     workflow processa o que estiver pendente no banco.
#
# O que roda (src/lgpd_purga.py):
#   1. pedidos sobre a base de treino (revogacao, eliminacao): apaga no remote
#      as versoes do dataset e os recortes com o titular, depois as linhas da
#      base de treino, depois marca o pedido como executado;
#   2. eliminacoes confirmadas pela clinica: delete em `pacientes` (cascade);
#   3. retencao: versoes do DVC que deixaram de ser vigentes em main ha' mais
#      de 90 dias, consultas da base de treino fora da janela e provas de
#      consentimento eliminadas ha' mais de 365 dias.
# Lista explicita de hashes a partir do historico git, nunca `dvc gc`; a
# semente, o modelo vigente e tudo o que main ou um PR aberto referencia
# ficam de fora (salvo, na eliminacao, a versao do dataset com o titular).
# O log tem so' contadores.
name: Purga LGPD

on:
  schedule:
    # 13:37 UTC = 10:37 em Sao Paulo: depois do job D-2 (08h17) e do canario
    # (09h47). Minuto "quebrado" pelo mesmo motivo dos outros crons.
    - cron: "37 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Duas purgas simultaneas disputariam os mesmos pedidos.
  group: lgpd
  cancel-in-progress: false

jobs:
  purga:
    # Defesa a mais alem da regra do environment: so' em main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: lgpd
      deployment: false
    env:
      DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING_EXCLUSAO }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OBSERVABILIDADE_ATIVA: "false"
      # Dead-man's-switch proprio (ADR-006): sem ele, um workflow desativado
      # pelo GitHub (60 dias sem atividade) deixaria pedidos do titular
      # vencerem o prazo de 15 dias em silencio.
      HEALTHCHECKS_LGPD_URL: ${{ secrets.HEALTHCHECKS_LGPD_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historico inteiro e todos os branches: o que e' vigente sai do
          # historico de main, e o que um PR aberto referencia fica protegido.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Instalar dependencias
        # ui.txt traz o supabase-py; dvc.txt, o acesso ao remote pelas classes
        # do proprio DVC (mesmo layout do `dvc push`).
        run: pip install -r requirements/ui.txt -r requirements/dvc.txt

      - name: Configurar remote do DVC
        # A URL nunca entra em .dvc/config (versionado).
        run: dvc remote add --local -f azure "$DVC_REMOTE_URL"

      - name: Purga
        run: python src/lgpd_purga.py --ref HEAD

      - name: Ping do dead-man's-switch (sucesso)
        if: success() && env.HEALTHCHECKS_LGPD_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_LGPD_URL"

      - name: Ping do dead-man's-switch (falha)
        if: failure() && env.HEALTHCHECKS_LGPD_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_LGPD_URL/fail" || true
