# Dependency review (Passo 10.5): template do GitHub, sem adaptacao alem do
# pin por SHA. Gratuito em repositorio publico; bloqueia PR que traz
# dependencia com vulnerabilidade conhecida -- inclusive as dos workflows.
name: Dependency review

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
