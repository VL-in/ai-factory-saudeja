# Classificador (src/modelo.py, a mesma fabrica do train.py e do
# scripts/avaliar_cv.py). Os valores abaixo sao os do campeao em producao
# (LightGBM + SMOTE-NC, sem calibracao): trocar qualquer um muda o modelo do
# proximo re-treino, que ainda passa pelo gate. Em experimento, troque com
# `dvc exp run -S`, nunca editando este arquivo.
# - tipo: lightgbm | logistica (one-hot + padronizacao, num Pipeline salvo no
#   model.pkl; SHAP linear exato em src/explain.py).
# - calibracao: none | sigmoid (Platt com CV interna de 5 folds, so' com
#   balancing.strategy class_weight ou none). Com class_weight, sem calibrar a
#   probabilidade fica centrada em 0,5 e o threshold perde o sentido.
# - min_child_samples, reg_lambda, subsample, subsample_freq, colsample_bytree:
#   regularizacao do LightGBM; null = default da biblioteca (como antes). Ponto
#   de partida medido na validacao cruzada: num_leaves 8, max_depth 3,
#   min_child_samples 20, reg_lambda 5, subsample 0.8 (subsample_freq 1).
# - logistica.C: inverso da regularizacao L2 da logistica (0.3, medido).
model:
  tipo: lightgbm
  calibracao: none
  n_estimators: 120
  learning_rate: 0.02
  max_depth: 6
  num_leaves: 32
  min_child_samples: null
  reg_lambda: null
  subsample: null
  subsample_freq: null
  colsample_bytree: null
  logistica:
    C: 0.3

balancing:
  strategy: smotenc      # smotenc | class_weight | none (ADR-003 e emenda)
  k_neighbors: 3         # SMOTE-NC: vizinhos da interpolacao

# Regra de decisao do lembrete pago (src/decisao.py).
# - modo: threshold | top_fracao. threshold avisa quem passa de `threshold`;
#   top_fracao avisa os ceil(fracao_da_fila x fila) de maior probabilidade da
#   fila do job (o orcamento do BRIEFING), com as duas valvulas abaixo.
# - threshold: corte da API /predict nos dois modos, e o ponto em que
#   recall_1/f1_1 sao medidos (informativos no gate).
# - fracao_da_fila: 0.30 = "cortar 70% do custo de mensageria". Tambem e' a
#   fracao do recall_at_fracao que o validate.py loga e o gate compara.
# - probabilidade_minima / probabilidade_certa (null = desligada), so' no
#   top_fracao e na escala da probabilidade -- so' tem sentido com modelo
#   calibrado (model.calibracao: sigmoid). Abaixo da minima nao avisa nem com
#   orcamento sobrando; acima da certa avisa mesmo estourando a fracao. Na
#   logistica calibrada (validacao cruzada da semente), 0.15 barra ~2% da fila
#   e 0.50 forca ~1%; a mediana e' 0.26 e a taxa base 0.27.
# O job D-2 decide cada modelo pela regra registrada junto dele
# (champion_metrics.json / canario.json, bloco `decisao`, gravado pelo gate a
# partir deste bloco). Campeao registrado antes da regra decide pelo
# `threshold` daqui, conferido contra o registrado. Trocar o modo aqui muda o
# PROXIMO desafiante, que ainda passa pelo gate e pelo canario.
decision:
  threshold: 0.6         # corte de probabilidade para classificar como no-show (classe 1)
  modo: threshold
  fracao_da_fila: 0.30
  probabilidade_minima: 0.15
  probabilidade_certa: 0.50

features:
  temporais: true       # true | false -- inclui dia_de_semana e horario
  # true troca o horario cru (~10 niveis) por periodo (manha | inicio de tarde |
  # fim de tarde), fim_expediente_sexta e fim_de_semana; exige temporais. O
  # serving le esta flag: so' muda junto com um model.pkl treinado com ela
  # (inference.verificar_assinatura barra a carga se divergir).
  periodo_do_dia: false

# Gate de promoção do re-treino mensal (src/retrain_gate.py).
# Tolerância de REGRESSÃO relativa ao campeão (data/champion_metrics.json),
# não alvo absoluto -- os alvos do SLO §3 (recall_1>=0.75, f1_1>=0.65) o
# modelo vigente já viola, e se fossem critério de promoção nada jamais
# seria promovido (ver SLO §3.1). Os números vivem aqui, e não no código,
# porque a regra que os gera depende do tamanho do fold: a tolerância das
# métricas de contagem é ~= 1/(positivos no fold de teste). Com 21
# positivos, um único paciente move recall_1 em 1/21 ~= 0.048 -- tolerância
# menor que isso bloquearia/promoveria por ruído de amostragem. roc_auc é
# contínua e não sofre desse salto. Revisar quando o dataset crescer
# com desfechos reais: com >=50 positivos no fold cai para 0.02 -- o gate avisa
# quando esse ponto chegar.
gate:
  tolerancia:
    recall_1: 0.05
    f1_1: 0.05
    roc_auc: 0.02
  # Piso ABSOLUTO, alem da comparacao relativa: sem ele, cada
  # promocao pode regredir ate' a tolerancia em relacao ao campeao da vez e,
  # somadas, as regressoes pequenas levam o modelo para perto do acaso (efeito
  # catraca). 0.60 e' decisao da autora; o campeao vigente mede 0.643.
  piso:
    roc_auc: 0.60
  # Fracao do fold de teste que o desafiante mandaria para lembrete pago no
  # threshold vigente. So' NOTIFICA acima disto, nao bloqueia (decisao da
  # autora): 0.30 e' o "cortar 70% do custo de mensageria" do BRIEFING. O
  # campeao vigente marca 22 de 76 (29%).
  taxa_disparo_alerta: 0.30

# Contrato de dados (src/contrato_features.py e src/validate_data.py).
# Especialidades que o cadastro oferece -- a lista vem daqui, e nao do mapa do
# modelo, para o que a clinica atende ser configuracao e nao efeito colateral do
# ultimo treino. tests/test_contrato_features.py trava que ela esta' contida no
# mapa do modelo em producao, e a suite de sanidade faz o mesmo com o desafiante
# do re-treino: especialidade do cadastro que o modelo nao conhece seria
# quarentena garantida para todo paciente dela.
cadastro:
  especialidades:
    - cardiologia
    - clinica geral
    - dermatologia
    - ginecologia
    - oftalmologia
    - ortopedia
    - pediatria

# Checagens de distribuicao do stage validate_data, que BLOQUEIAM o re-treino
# antes de treinar. O minimo de positivos no fold de teste nao mora aqui: e'
# derivado de gate.tolerancia (1/tolerancia), pela mesma regra do SLO 3.1 --
# com menos positivos que isso, a tolerancia do gate fica menor que o passo de
# um unico paciente e ele decide por sorteio.
dados:
  taxa_positivos:
    minimo: 0.10
    maximo: 0.50
  # PSI por feature (producao x semente) acima disto vira ALERTA no resumo do
  # re-treino, sem bloquear. 0.2 e' o corte usual de "mudanca relevante".
  psi_alerta: 0.2
  # Dataset externo de desfecho real (ADR-014): Kaggle noshowappointments,
  # CC BY-NC-SA 4.0, origem `externa`, arquivos em data/externo/ (DVC).
  # DESLIGADO ate' a emenda do ADR-014 que libera o uso no treino oficial:
  # com `habilitada: false`, nenhuma linha externa entra em
  # data/consultas-treino.csv (tests/test_dataset_externo_dados.py trava).
  # n_amostra: linhas da amostra de treino (consultas-externas.csv) -- passa
  # dos limiares de 200 e 600 linhas reais da regra de peso da semente e da'
  # ~85 positivos no fold de teste. random_state: sorteio das features
  # imputadas, do teste reservado e da amostra (gravado no manifesto).
  # razao_sinal_sexta: sinal DECLARADO (emenda do ADR-014) -- o horario imputado
  # das consultas de sexta e' trocado entre elas para que a falta em 17h-18h
  # fique 1,25x a do resto do pool (~36% contra ~28%). Hipotese herdada que o
  # Kaggle nao testa (nao tem hora); desfecho, data e dia da semana sao os reais.
  externa:
    habilitada: false
    n_amostra: 1500
    random_state: 42
    razao_sinal_sexta: 1.25
  # Regras para quando o desfecho real chega (src/regras_dado_real.py). Hoje o
  # validate_data so' REPORTA o que elas recomendariam; aplica-las no treino e'
  # decisao com ADR proprio. Desfecho real = producao + externa (a externa conta,
  # porque o objetivo e' tirar peso do sintetico).
  # - peso_semente: abaixo de limiar_reduzir linhas reais, a semente pesa 1; a
  #   partir dele, peso_reduzido; a partir de limiar_retirar, 0 (sai do treino).
  # - split.dias_producao_cronologico: com mais dias que isto entre a primeira e
  #   a ultima consulta de PRODUCAO (externa nao conta), o fold de teste passa a
  #   ser cronologico.
  peso_semente:
    limiar_reduzir: 200
    limiar_retirar: 600
    peso_reduzido: 0.3
  split:
    dias_producao_cronologico: 60

# Canario do modelo (ADR-008, src/canario.py). O desafiante que
# passa no gate nao substitui o campeao de uma vez: decide `fracao` da fila do
# job D-2 (sorteio estavel por paciente) e e' comparado ao campeao no MESMO
# periodo, na fila real. Os guardrails sao de NAO-INFERIORIDADE: o canario pode
# ser pior que o campeao por menos que a `margem` (pontos percentuais), com
# significancia (z unilateral, Agresti-Caffo). Violacao reverte na hora; sem
# evidencia ate' `dias_maximos`, reverte tambem -- o conservador e' o campeao.
#
# Os minimos de amostra sao PISOS, nao o criterio: quem decide e' o teste. Com
# taxas iguais nos dois bracos, ~300 no canario (e 4x isso no campeao, com
# fracao 0.2) ja' bastam para afirmar nao-inferioridade a 5 p.p. -- volume de
# poucos dias com varias clinicas. Com o volume de uma clinica so' (~10
# agendamentos/dia no canario) a evidencia nao fecha em 21 dias e o canario e'
# revertido por prazo: o comportamento seguro, mas que congela o modelo.
canario:
  habilitado: true          # false = promocao direta pelo gate (comportamento anterior)
  fracao: 0.20              # parte da fila decidida pelo canario
  dias_minimos: 7           # cobre um ciclo semanal completo da agenda
  dias_maximos: 21          # menor que o intervalo do re-treino mensal
  predicoes_minimas: 300    # no braco do canario
  desfechos_minimos: 300    # baixo risco com desfecho registrado, no canario
  amostra_minima_por_braco: 30   # abaixo disto nenhum guardrail e' avaliado
  z_critico: 1.645          # 95% unilateral
  margem:
    taxa_disparo: 0.05      # custo: lembrete pago (BRIEFING: cortar 70%)
    falta_nao_avisada: 0.05 # erro que custa R$ 180: baixo risco que faltou
    quarentena: 0.02        # fila que o modelo nao conseguiu predizer

# Custo da mensageria (observabilidade com Grafana). Fonte unica dos precos: o
# job D-2 soma o custo de cada envio a `saudeja_sms_custo_usd_total`, e o
# provisionamento do Grafana copia estes numeros para o painel e para o alerta
# de custo, que multiplicam os segmentos da view
# `observabilidade.envios_cobrados_por_mes`. Preco nao e' identificador de
# infraestrutura e pode ficar no git.
#
# - sms_unitario_usd: preco de UM SEGMENTO de SMS no contrato da Infobip, em
#   dolares, a moeda do contrato e do orcamento (sem cambio no alerta de custo).
#   A Infobip cobra por segmento, e um lembrete com acento passa de 70
#   caracteres e vira dois (messaging.client.segmentos_sms). Vazio = o lembrete
#   sai normalmente, o custo nao e' medido e o resumo do job avisa.
# - cambio_usd_brl: reais por dolar, so' para exibir o custo em reais no painel.
#   Revisado no inicio de cada mes (5.07 em 2026-10-16).
# - orcamento_mensal_usd: teto do BRIEFING. Custo projetado do mes acima de 80%
#   dele e' alerta P2. A infraestrutura (Supabase, HF Space, Grafana) esta' em
#   planos gratuitos: custo fixo zero, o que se monitora e' a cota.
custo:
  sms_unitario_usd: 0.0291
  cambio_usd_brl: 5.07
  orcamento_mensal_usd: 100

# Limites dos alertas do Grafana (infra/grafana/alertas/). O provisionamento
# (scripts/grafana_provisionar.py) copia estes numeros para as regras: um lugar
# so', revisado em PR como os outros limites deste arquivo.
#
# - fila_d2_horario_limite: hora de Sao Paulo a partir da qual a falta de uma
#   execucao `ok` do job D-2 no dia e' alerta critico (P1). O job e' disparado
#   as 08h17 pelo pg_cron do Supabase de producao (o cron do GitHub, num fork,
#   chegava com 3 a 9 horas de atraso e ficou como reserva).
# - disparos: regra dos +-40%. Os disparos do dia contra a media dos
#   `janela_dias` anteriores com fila; fora da faixa, a taxa de disparo decide o
#   nivel (moveu junto, na mesma direcao e alem da mesma faixa: P2, o modelo;
#   senao: P3, a agenda). Abaixo de `piso_media_diaria` disparos/dia de media, ou
#   sem `janela_dias` de historico, a regra fica em silencio.
# - fracao_de_alerta: custo projetado do mes acima desta fracao do orcamento
#   (P2) e uso de cota do plano gratuito acima dela (P3).
# - cota_banco_supabase_mb: limite do banco no plano gratuito do Supabase.
# - p95_predicao_ms: indicador de desenvolvimento do SLO §2 (fora do
#   compromisso de producao): acima dele, P3.
observabilidade:
  fila_d2_horario_limite: "13:00"
  disparos:
    variacao: 0.40
    piso_media_diaria: 10
    janela_dias: 7
  fracao_de_alerta: 0.80
  cota_banco_supabase_mb: 500
  p95_predicao_ms: 2000
