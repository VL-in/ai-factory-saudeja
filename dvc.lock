schema: '2.0'
stages:
  train:
    cmd: docker build -t saudeja-train -f dockerfile . && docker compose up -d 
      mlflow-server && docker run --rm --network saudeja-net -v 
      "%cd%/data:/app/data" -e MODEL_PATH=/app/data/model.pkl -e 
      MLFLOW_TRACKING_URI=http://mlflow-server:5000 saudeja-train
    deps:
    - path: data/consultas-historicas.csv
      hash: md5
      md5: b3ee3ee6510bfb9f61740b2d38222405
      size: 15220
    - path: dockerfile
      hash: md5
      md5: 24bcad5856996ceec326fd45c3e5e3e9
      size: 433
    - path: requirements.txt
      hash: md5
      md5: b45d19914c963721c513627ae0f79229
      size: 223
    - path: src/train.py
      hash: md5
      md5: ef987585a1effd5da8fb422a78e41f79
      size: 5536
    params:
      params.yaml:
        balancing.k_neighbors: 3
        balancing.strategy: smotenc
        model.learning_rate: 0.05
        model.max_depth: 6
        model.n_estimators: 200
        model.num_leaves: 31
    outs:
    - path: data/model.pkl
      hash: md5
      md5: 65ddd71e09f254b284917b5466c90909
      size: 286574
