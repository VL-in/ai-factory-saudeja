schema: '2.0'
stages:
  train:
    cmd: docker build -t saudeja-train -f dockerfile . && docker compose up -d 
      --wait mlflow-server && docker run --rm --network saudeja-net -v 
      "%cd%/data:/app/data" -e TRAIN_RAW_PATH=/app/data/interim/train_raw.pkl -e
      MAPA_ESPECIALIDADE_PATH=/app/data/interim/mapa_especialidade.json -e 
      MODEL_PATH=/app/data/model.pkl -e 
      RUN_ID_PATH=/app/data/interim/mlflow_run_id.txt -e 
      MLFLOW_TRACKING_URI=http://mlflow-server:5000 saudeja-train src/train.py
    deps:
    - path: data/interim/mapa_especialidade.json
