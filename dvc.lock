      md5: 17c2ce6018d69aff154db690278e8f1f
      size: 31276
    - path: dockerfile
      hash: md5
      md5: 33a725e5f6b524c0313ffe4a976d2176
      size: 544
    - path: requirements.txt
      hash: md5
      md5: b45d19914c963721c513627ae0f79229
      size: 223
    - path: src/preprocess.py
      hash: md5
      md5: 2c1f533821f8213d5bbfe64285c8ef4f
      size: 3299
    - path: src/train.py
      hash: md5
      md5: 1f792b00945ae9daaeabc9d66774aa33
      size: 4543
    params:
      params.yaml:
        balancing.k_neighbors: 3
        model.learning_rate: 0.02
        model.max_depth: 6
        model.n_estimators: 120
        model.num_leaves: 32
    outs:
    - path: data/interim/mlflow_run_id.txt
      hash: md5
