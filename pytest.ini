[pytest]
markers =
    integracao: testes de integração mais lentos (ex.: build/run de Docker), não rodam por padrão
addopts = -m "not integracao"
# Simulador do NiceGUI (tests/web/): as fixtures dele são assíncronas e não
# levam o marcador do pytest-asyncio. Nenhum outro teste da suíte é assíncrono.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
