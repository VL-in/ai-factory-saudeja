services:
  # Aplicacao completa (API FastAPI + interface Streamlit no mesmo container),
  # exatamente como vai rodar no Hugging Face Space -- ver infra/deploy/.
  # Nao monta ./data por volume de proposito: a imagem empacota o model.pkl, e
  # montar o diretorio local esconderia justamente o que se quer verificar
  # aqui (que a imagem se sustenta sozinha). Trocou o modelo? Rebuilda.
  app:
    build:
      context: .
      dockerfile: infra/deploy/dockerfile
    container_name: saudeja-app
    # SUPABASE_URL/SUPABASE_SECRET_KEY vêm do .env local -- nunca
    # hardcoded aqui. Sem .env na raiz, "Fila do dia"/cadastro de paciente
    # falham com ErroPersistencia (ver src/ui/logic.py), o resto da UI segue
    # funcionando.
    env_file:
      - path: .env
        required: false
    environment:
      # dev local: mostra a aba "Dev: disparo manual". No Space, APP_ENV=prod.
      APP_ENV: dev
      # ADR-005 (b): a UI chama o modelo em processo. Troque para "api" para
      # fazer a UI conversar com a API deste mesmo container por HTTP.
      PREDICT_BACKEND: processo
    ports:
      - "7860:7860"   # interface Streamlit (mesma porta que o HF Space publica)
      - "8000:8000"   # API FastAPI (integracoes externas, diagrama C2)
    networks:
      - saudeja-net
    healthcheck:
      # Sem curl/wget na imagem (python:3.10-slim) -- usa o proprio python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  # Imagem de treino compartilhada pelos 3 stages do dvc.yaml
  # (preprocess/train/validate) e pelo tune.py exploratorio. Existe como
  # servico do compose -- e nao so' como "docker run" solto dentro do
  # dvc.yaml -- porque o compose resolve "./data" relativo a ESTE arquivo,
  # nos dois sistemas operacionais. O mount antigo usava "%cd%", sintaxe do
  # cmd.exe que nao expande no runner Linux do GitHub Actions, o que tornava
  # "dvc repro" no CI (re-treino mensal) impossivel: o Docker criava um
  # diretorio com o nome literal "%cd%" em vez de montar o data/.
  #
  # Sem container_name: "docker compose run" cria um container por execucao,
  # e um nome fixo impediria duas etapas de rodarem em sequencia/paralelo.
  # A tag "saudeja-train" e' mantida para os comandos manuais do README
  # continuarem valendo.
  #
  # Sem depends_on do mlflow-server: o stage "preprocess" nao fala com o
  # MLflow, e so' "train"/"validate" o sobem explicitamente (docker compose
  # up -d --wait mlflow-server) antes de rodar.
  train:
    build:
      context: .
      dockerfile: dockerfile
    image: saudeja-train
    volumes:
      - ./data:/app/data
    networks:
      - saudeja-net

  mlflow-server:
    build:
      context: .
      dockerfile: dockerfile.mlflow
    container_name: saudeja-mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow-db:/mlflow/db
      - mlflow-artifacts:/mlflow/artifacts
    restart: unless-stopped
    networks:
      - saudeja-net
    healthcheck:
      # Sem curl/wget na imagem (python:3.10-slim) -- usa o proprio python.
      # Sem isso, "docker compose up -d" retorna assim que o container inicia,
      # nao quando o gunicorn ja aceita conexoes, e o docker run seguinte
      # (train/validate) pode tentar falar com o MLflow antes dele estar de pe.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  saudeja-net:
    name: saudeja-net

volumes:
  mlflow-db:
  mlflow-artifacts:
